services:
  factish:
    build: .
    container_name: factish
    restart: unless-stopped
    user: "1001:1001"
    env_file: .env
    ports:
      - "127.0.0.1:18081:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/bootstrap', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
