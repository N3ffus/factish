[project]
name = "factish"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "pillow>=11.0",
  "python-multipart>=0.0.9",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
